<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Editor de Escenas - IMSSight</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.card-editor{

    border:none;

    border-radius:20px;

    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.titulo{

    color:#235B4E;

    font-weight:800;
}

textarea{

    width:100%;

    min-height:400px;

    background:#1e1e1e;

    color:#00ff90;

    border-radius:15px;

    padding:20px;

    font-family:monospace;

    border:none;

    resize:vertical;
}

.preview{

    min-height:300px;

    background:white;

    border-radius:15px;

    padding:20px;

    border:2px dashed #ccc;

    overflow:auto;
}

.bloque-pregunta{

    background:#f8fafc;

    border-radius:15px;

    padding:20px;

    border:1px solid #dee2e6;
}

.oculto{

    display:none;
}

label{

    font-weight:600;
}

</style>

</head>

<body>

<div class="container py-5">

    <div class="card card-editor">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h1 class="titulo mb-0">

                        Editor de Escenas

                    </h1>

                    <small class="text-muted">

                        IMSSight Engine

                    </small>

                </div>

                <button
                    class="btn btn-success btn-lg"
                    onclick="guardarEscena()">

                    <i class="fa fa-save me-2"></i>

                    Guardar escena

                </button>

            </div>

            <!-- DATOS GENERALES -->

            <div class="row">

                <div class="col-md-3 mb-3">

                    <label>ID Caso</label>

                    <input
                        type="number"
                        id="idCaso"
                        class="form-control">

                </div>

                <div class="col-md-2 mb-3">

                    <label>Orden</label>

                    <input
                        type="number"
                        id="orden"
                        class="form-control"
                        value="1">

                </div>

                <div class="col-md-3 mb-3">

                    <label>Tipo</label>

                    <select
                        id="tipo"
                        class="form-select">

                        <option value="texto">
                            Texto
                        </option>

                        <option value="objetivos">
                            Objetivos
                        </option>

                        <option value="video">
                            Video
                        </option>

                        <option value="escenario">
                            Escenario
                        </option>

                        <option value="pregunta">
                            Pregunta
                        </option>

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Multimedia</label>

                    <input
                        type="text"
                        id="multimedia"
                        class="form-control"
                        placeholder="../video/video.mp4">

                </div>

            </div>

            <!-- TITULO -->

            <div class="mb-4">

                <label>Título</label>

                <input
                    type="text"
                    id="titulo"
                    class="form-control">

            </div>

            <!--
            |--------------------------------------------------------------------------
            | BLOQUE GENERADOR VISUAL DE PREGUNTAS
            |--------------------------------------------------------------------------

            -->

            <div id="bloquePregunta" class="card border-0 shadow-sm mb-4">

                <div class="card-body">

                    <div class="d-flex align-items-center mb-4">

                        <i class="fa fa-wand-magic-sparkles text-primary fa-2x me-3"></i>

                        <div>

                            <h4 class="mb-0">

                                Constructor Visual de Preguntas

                            </h4>

                            <small class="text-muted">

                                Genera automáticamente HTML clínico para IMSSight

                            </small>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-12 mb-3">

                            <label>

                                Pregunta clínica

                            </label>

                            <textarea
                                id="preguntaVisual"
                                class="form-control"
                                style="
                                    min-height:120px;
                                    background:white;
                                    color:black;
                                    font-family:inherit;
                                "></textarea>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Opción A</label>

                            <input
                                type="text"
                                id="visualA"
                                class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Opción B</label>

                            <input
                                type="text"
                                id="visualB"
                                class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Opción C</label>

                            <input
                                type="text"
                                id="visualC"
                                class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Opción D</label>

                            <input
                                type="text"
                                id="visualD"
                                class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>
                                Retroalimentación correcta
                            </label>

                            <textarea
                                id="retroCorrecta"
                                class="form-control"
                                rows="4"></textarea>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>
                                Retroalimentación incorrecta
                            </label>

                            <textarea
                                id="retroIncorrecta"
                                class="form-control"
                                rows="4"></textarea>

                        </div>

                    </div>

                    <div class="row">

    <!-- RESPUESTA CORRECTA -->
    <div class="col-md-4 mb-3">

        <label>

            Respuesta correcta

        </label>

        <select
            id="visualCorrecta"
            class="form-select">

            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>

        </select>

    </div>

    <!-- EVALUABLE -->
    <div class="col-md-4 mb-3">

        <label>

            ¿Escena evaluable?

        </label>

        <select
            id="evaluable"
            class="form-select">

            <option value="1">

                Sí

            </option>

            <option value="0">

                No

            </option>

        </select>

    </div>

    <!-- PUNTOS -->
    <div class="col-md-4 mb-3">

        <label>

            Puntos

        </label>

        <input
            type="number"
            id="puntos"
            class="form-control"
            value="1">

    </div>

    <!-- BOTON -->
    <div class="col-md-12 d-flex align-items-end">

        <button
            class="btn btn-primary w-100"
            onclick="generarPreguntaVisual()">

            <i class="fa fa-bolt me-2"></i>

            Generar pregunta visual

        </button>

    </div>

</div>

                </div>

            </div>

            <!-- EDITOR -->

            <div class="row">

                <div class="col-md-6">

                    <h5 class="mb-3">

                        HTML / Contenido

                    </h5>

                    <textarea id="contenido">

<div class="alert alert-primary">

    Hola IMSSight 😄

</div>

                    </textarea>

                </div>

                <div class="col-md-6">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5 class="mb-0">

                            Vista previa

                        </h5>

                        <button
                            class="btn btn-primary btn-sm"
                            onclick="previsualizar()">

                            <i class="fa fa-rotate-right me-2"></i>

                            Actualizar

                        </button>

                    </div>

                    <div
                        id="preview"
                        class="preview">

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

function generarPreguntaVisual(){

    const pregunta =
        document.getElementById(
            'preguntaVisual'
        ).value;

    const a =
        document.getElementById(
            'visualA'
        ).value;

    const b =
        document.getElementById(
            'visualB'
        ).value;

    const c =
        document.getElementById(
            'visualC'
        ).value;

    const d =
        document.getElementById(
            'visualD'
        ).value;

    const correcta =
        document.getElementById(
            'visualCorrecta'
        ).value;

    const retroCorrecta =
        document.getElementById(
            'retroCorrecta'
        ).value;

    const retroIncorrecta =
        document.getElementById(
            'retroIncorrecta'
        ).value;

    /*
    |--------------------------------------------------------------------------
    | VALIDAR CORRECTAS
    |--------------------------------------------------------------------------
    */

    const esA =
        correcta === 'A' ? 1 : 0;

    const esB =
        correcta === 'B' ? 1 : 0;

    const esC =
        correcta === 'C' ? 1 : 0;

    const esD =
        correcta === 'D' ? 1 : 0;

    /*
    |--------------------------------------------------------------------------
    | HTML
    |--------------------------------------------------------------------------
    */

    const html = `

<div class="container my-4">

    <div class="text-center mb-4">

        <p class="text-muted small mb-0">

            ${pregunta}

        </p>

    </div>

    <div id="retroalimentacion" class="mb-4"></div>

    <div class="row g-3">

        ${crearBotonPregunta(
            'A',
            a,
            esA,
            correcta,
            retroCorrecta,
            retroIncorrecta
        )}

        ${crearBotonPregunta(
            'B',
            b,
            esB,
            correcta,
            retroCorrecta,
            retroIncorrecta
        )}

        ${crearBotonPregunta(
            'C',
            c,
            esC,
            correcta,
            retroCorrecta,
            retroIncorrecta
        )}

        ${crearBotonPregunta(
            'D',
            d,
            esD,
            correcta,
            retroCorrecta,
            retroIncorrecta
        )}

    </div>

</div>

`;

    /*
    |--------------------------------------------------------------------------
    | INSERTAR
    |--------------------------------------------------------------------------
    */

    const editor =
        document.getElementById(
            'contenido'
        );

    editor.value += html;

    previsualizar();

}

function crearBotonPregunta(

    letra,
    texto,
    correcta,
    respuestaCorrecta,
    retroCorrecta,
    retroIncorrecta

){

    const tipo =
        correcta
        ? 'success'
        : 'danger';

    const icono =
        correcta
        ? 'check-circle-fill'
        : 'x-circle-fill';

    const titulo =
        correcta
        ? '¡Excelente!'
        : 'Retroalimentación';

    const animacion =
        correcta
        ? 'bounceIn'
        : 'shakeX';

    const retro =
        correcta
        ? retroCorrecta
        : retroIncorrecta;

    return `

    <div class="col-md-6">

        <button

            class="btn btn-outline-primary text-start p-3 w-100 h-100 shadow-sm border-2 d-flex align-items-center"

            style="border-radius:15px;"

            onclick="

                guardarRespuesta('${letra}',${correcta});

                document.getElementById('retroalimentacion').innerHTML = \`

                <div
                    class='alert alert-${tipo} border-0 shadow animate__animated animate__${animacion}'
                    style='border-radius:20px;'>

                    <div class='d-flex align-items-center mb-2'>

                        <i class='bi bi-${icono} text-${tipo} fs-4 me-2'></i>

                        <h5 class='fw-bold mb-0'>
                            ${titulo}
                        </h5>

                    </div>

                    <hr>

                    <p class='mb-1'>

                        <strong>

                            Respuesta correcta:
                            ${respuestaCorrecta}

                        </strong>

                    </p>

                    <p class='small mb-0 text-dark'>

                        ${retro}

                    </p>

                </div>

                \`;

            ">

            <span class="badge bg-dark me-3">

                ${letra}

            </span>

            <span>

                ${texto}

            </span>

        </button>

    </div>

    `;

}

function previsualizar(){

    const contenido =
        document.getElementById(
            'contenido'
        ).value;

    document.getElementById(
        'preview'
    ).innerHTML = contenido;

}

previsualizar();

const params =

    new URLSearchParams(
        window.location.search
    );

const idCaso =
    params.get('idCaso');

const orden =
    params.get('orden');

if(idCaso){

    document.getElementById(
        'idCaso'
    ).value = idCaso;

}
else{

    alert(
        'No se recibió ID del caso clínico'
    );

}

if(orden){

    document.getElementById(
        'orden'
    ).value = orden;

}

/*
|--------------------------------------------------------------------------
| MOSTRAR / OCULTAR BLOQUE PREGUNTA
|--------------------------------------------------------------------------
*/

document.getElementById(
    'tipo'
).addEventListener(
    'change',
    togglePregunta
);

function togglePregunta(){

    const tipo =
        document.getElementById(
            'tipo'
        ).value;

    const bloque =
        document.getElementById(
            'bloquePregunta'
        );

    if(tipo === 'pregunta'){

        bloque.classList.remove(
            'oculto'
        );

    }
    else{

        bloque.classList.add(
            'oculto'
        );

    }

}

togglePregunta();

/*
|--------------------------------------------------------------------------
| GUARDAR ESCENA
|--------------------------------------------------------------------------
*/

async function guardarEscena(){

    const tipoEscena =
    document.getElementById(
        'tipo'
    ).value;

    const data = {

        id_caso:
            document.getElementById(
                'idCaso'
            ).value,

        orden:
            document.getElementById(
                'orden'
            ).value,

        tipo:
            tipoEscena,

        titulo:
            document.getElementById(
                'titulo'
            ).value,

        multimedia:
            document.getElementById(
                'multimedia'
            ).value,

        contenido:
            document.getElementById(
                'contenido'
            ).value,

        respuesta_correcta:
            tipoEscena === 'pregunta'
            ? document.getElementById(
                'visualCorrecta'
            ).value
            : null,

        evaluable:
            tipoEscena === 'pregunta'
            ? document.getElementById(
                'evaluable'
            ).value
            : 0

    };

    try{

        const response =
            await fetch(

                '../php/guardar_escena.php',

                {

                    method:'POST',

                    headers:{
                        'Content-Type':'application/json'
                    },

                    body:JSON.stringify(
                        data
                    )

                }

            );

        const resultado =
            await response.json();

        alert(
            resultado.mensaje
        );

    }
    catch(error){

        console.error(error);

        alert(
            'Error al guardar'
        );

    }

}

</script>

</body>
</html>
