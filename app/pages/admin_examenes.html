<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Admin Exámenes
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>
                Exámenes
            </h1>

            <p class="text-muted">
                Administración IMSSight
            </p>

        </div>

        <a
            href="profile.html"
            class="btn btn-dark">

            Volver

        </a>

    </div>

    <!-- SELECT ESPECIALIDAD -->

    <div class="card shadow border-0 mb-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-4">

                    <label>
                        Especialidad
                    </label>

                    <select
                        id="selectEspecialidad"
                        class="form-select"
                        onchange="cargarTemas()">

                    </select>

                </div>

                <div class="col-md-4">

                    <label>
                        Tema
                    </label>

                    <select
                        id="selectTema"
                        class="form-select"
                        onchange="cargarCasos()">

                    </select>

                </div>

                <div class="col-md-4">

                    <label>
                        Caso clínico
                    </label>

                    <select
                        id="selectCaso"
                        class="form-select"
                        onchange="cargarExamenes()">

                    </select>

                </div>

            </div>

        </div>

    </div>

    <!-- NUEVO EXAMEN -->

    <div class="card shadow border-0 mb-5">

        <div class="card-body">

            <h4 class="mb-4">
                Nuevo examen clínico
            </h4>

            <div class="row">

    <div class="col-md-5">

        <label>
            Título
        </label>

        <input
            type="text"
            id="titulo"
            class="form-control">

        </div>

        <div class="col-md-5">

            <label>
                Descripción
            </label>

            <input
                type="text"
                id="descripcion"
                class="form-control">

        </div>

        <div class="col-md-2 d-grid">

            <label style="opacity:0;">
                guardar
            </label>

            <button
                class="btn btn-success"
                onclick="guardarExamen()">

                Guardar

            </button>

        </div>

    </div>

        </div>

    </div>

    <!-- TABLA -->

    <div class="card shadow border-0">

        <div class="card-body">

            <h4 class="mb-4">
                Examenes registrados
            </h4>

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Caso clínico</th>
                            <th>Título examen</th>
                            <th>Descripción</th>
                            <th>Activo</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tablaExamenes">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

async function cargarEspecialidades() {

    const response =
        await fetch('../php/get_especialidades.php');

    const especialidades =
        await response.json();

    const select =
        document.getElementById(
            'selectEspecialidad'
        );

    select.innerHTML = '';

    especialidades.forEach(e => {

        select.innerHTML += `

            <option value="${e.id}">

                ${e.nombre}

            </option>

        `;

    });

    cargarTemas();

}

/*
|--------------------------------------------------------------------------
| TEMAS
|--------------------------------------------------------------------------
*/

async function cargarTemas() {

    const idEspecialidad =
        document.getElementById(
            'selectEspecialidad'
        ).value;

    const response =
        await fetch(
            `../php/get_temas_admin.php?id=${idEspecialidad}`
        );

    const temas =
        await response.json();

    const selectTema =
        document.getElementById(
            'selectTema'
        );

    selectTema.innerHTML = '';

    temas.forEach(t => {

        selectTema.innerHTML += `

            <option value="${t.id}">

                ${t.titulo}

            </option>

        `;

    });

    cargarCasos();

}

/*
|--------------------------------------------------------------------------
| CASOS
|--------------------------------------------------------------------------
*/

async function cargarCasos(){

    const idTema =
        document.getElementById(
            'selectTema'
        ).value;

    const response =
        await fetch(
            `../php/casos.php?id=${idTema}`
        );

    const casos =
        await response.json();

    const selectCaso =
        document.getElementById(
            'selectCaso'
        );

    selectCaso.innerHTML = '';

    casos.forEach(c => {

        selectCaso.innerHTML += `

            <option value="${c.id}">

                ${c.titulo}

            </option>

        `;

    });

    cargarExamenes();

}

/*
|--------------------------------------------------------------------------
| EXÁMENES
|--------------------------------------------------------------------------
*/

async function cargarExamenes() {

    const idCaso =
        document.getElementById(
            'selectCaso'
        ).value;

    const response =
        await fetch(
            `../php/examenes.php?id=${idCaso}`
        );

    const examenes =
        await response.json();

    const tabla =
        document.getElementById(
            'tablaExamenes'
        );

    tabla.innerHTML = '';

    examenes.forEach(e => {

        tabla.innerHTML += `

            <tr>

                <td>

                    ${e.id}

                </td>

                <td>

                    ${e.caso_titulo ?? ''}

                </td>

                <td>

                    <input
                        type="text"
                        id="titulo_${e.id}"
                        class="form-control"
                        value="${e.titulo}">

                </td>

                <td>

                    <input
                        type="text"
                        id="descripcion_${e.id}"
                        class="form-control"
                        value="${e.descripcion ?? ''}">

                </td>

                <td>

                    <select
                        id="activo_${e.id}"
                        class="form-select">

                        <option
                            value="1"
                            ${e.activo == 1 ? 'selected' : ''}>

                            Activo

                        </option>

                        <option
                            value="0"
                            ${e.activo == 0 ? 'selected' : ''}>

                            Inactivo

                        </option>

                    </select>

                </td>

                <td class="d-flex gap-2">

                    <a
                        href="admin_preguntas.html?id=${e.id}"
                        class="btn btn-info btn-sm">

                        Preguntas

                    </a>

                    <button
                        class="btn btn-primary btn-sm"
                        onclick="actualizarExamen(${e.id})">

                        Guardar

                    </button>

                </td>

            </tr>

        `;

    });

}

/*
|--------------------------------------------------------------------------
| GUARDAR EXAMEN
|--------------------------------------------------------------------------
*/

async function guardarExamen() {

    const id_caso =
        document.getElementById(
            'selectCaso'
        ).value;

    const titulo =
        document.getElementById(
            'titulo'
        ).value;

    const descripcion =
        document.getElementById(
            'descripcion'
        ).value;

    const response = await fetch(

        '../php/examenes.php',

        {

            method: 'POST',

            headers: {
                'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

                id_caso,
                titulo,
                descripcion

            })

        }

    );

    const resultado =
        await response.json();

    alert(resultado.mensaje);

    cargarExamenes();

}

/*
|--------------------------------------------------------------------------
| ACTUALIZAR EXAMEN
|--------------------------------------------------------------------------
*/

async function actualizarExamen(id) {

    const titulo =
        document.getElementById(
            `titulo_${id}`
        ).value;

    const descripcion =
        document.getElementById(
            `descripcion_${id}`
        ).value;

    const activo =
        document.getElementById(
            `activo_${id}`
        ).value;

    const response = await fetch(

        '../php/examenes.php',

        {

            method: 'POST',

            headers: {
                'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

                id,
                titulo,
                descripcion,
                activo

            })

        }

    );

    const resultado =
        await response.json();

    alert(resultado.mensaje);

    cargarExamenes();

}

cargarEspecialidades();

</script>

</body>
</html>
