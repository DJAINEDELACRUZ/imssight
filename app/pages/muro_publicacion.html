      align-items: center;

      background: linear-gradient(135deg, #285C4D, #9D2449);
      color: #ffffff;
      font-weight: 800;
      flex: 0 0 auto;

    .muro-chip {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      border-radius: 999px;
      padding: .25rem .55rem;
      font-size: .72rem;

      font-weight: 700;
      border-bottom: 1px solid rgba(var(--bs-primary-rgb), .28);

    .muro-link-card {
      display: flex;
      align-items: center;
      gap: .85rem;
      border: 1px solid rgba(var(--bs-primary-rgb), .24);
      border-left: 4px solid var(--bs-primary);
      border-radius: 12px;
      background: rgba(var(--bs-primary-rgb), .06);
      padding: .85rem 1rem;
      margin-top: .75rem;
      color: #404041;
    }

    .muro-link-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: var(--bs-primary);
      flex: 0 0 auto;
    }

    .muro-comment {
      border-radius: 10px;
      background: #F6F6F6;
      padding: .85rem 1rem;
    }

    .muro-field {
      border: 1.5px solid #A9A8A9 !important;
      border-radius: 12px !important;
      background: #FFFFFF !important;
      color: #404041 !important;
      padding: .85rem 1rem !important;
    }

    .muro-field:focus {
      border-color: #9D2449 !important;
      box-shadow: 0 0 0 .18rem rgba(157, 36, 73, .14) !important;
    }

    .muro-submit {
      background: #9D2449;
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(157, 36, 73, .2);
    }

    .muro-submit:hover,
    .muro-submit:focus {
      background: #285C4D;
      color: #ffffff;
    }

    .muro-delete-comment {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid #DDDDDD;
      background: #FFFFFF;
      color: #9D2449;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .muro-delete-comment:hover {
      background: rgba(157, 36, 73, .08);
      border-color: rgba(157, 36, 73, .35);
    }
  </style>

  <script>

    async function cargarEspecialidades() {

        try {

            const response = await fetch('../php/get_especialidades.php');

            const especialidades = await response.json();

            const contenedor = document.getElementById('menuEspecialidades');

            contenedor.innerHTML = '';

            especialidades.forEach(especialidad => {

                contenedor.innerHTML += `

                    <li class="nav-item">

                        <a class="nav-link text-white"
                          href="../pages/especialidad.html?id=${especialidad.id}">

                            <i class="material-symbols-rounded opacity-5">
                                ${especialidad.icono}
                            </i>

                            <span class="nav-link-text ms-1">
                                ${especialidad.nombre}

  <script>
    let idPublicacionActual = Number(new URLSearchParams(window.location.search).get('id') || 0);
    let publicacionActual = null;

    function escaparTexto(valor){
      return String(valor ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function inicialesAutor(nombre){
      return String(nombre ?? 'IM')
        .trim()
        .split(/\s+/)
        .slice(0,2)
        .map(parte => parte.charAt(0).toUpperCase())
        .join('') || 'IM';
    }

    function fechaMuro(fecha){
      if(!fecha){
        return '';
      }

      return new Date(fecha.replace(' ', 'T'))
        .toLocaleString('es-MX', {
          dateStyle:'medium',
          timeStyle:'short'
        });
    }

    function extraerUrls(texto){
      return [
        ...new Set(
          (String(texto ?? '').match(/https?:\/\/[^\s<>"']+/g) || [])
            .map(url => url.replace(/[),.;!?]+$/,''))
        )
      ];
    }

    function dominioUrl(url){
      try{
        return new URL(url).hostname.replace(/^www\./,'');
      }
      catch(error){
        return url;
      }
    }

    function renderTextoConEnlaces(texto){
      return escaparTexto(texto).trim().replace(
        /(https?:\/\/[^\s<>"']+)/g,
        url => {
          const limpio = url.replace(/[),.;!?]+$/,'');
          const sobrante = url.slice(limpio.length);
          return `<a class="muro-inline-link" href="${limpio}" target="_blank" rel="noopener noreferrer">${dominioUrl(limpio)}</a>${sobrante}`;
        }
      );
    }

    function renderLinkCards(texto){
      return extraerUrls(texto).map(url => `
        <a class="muro-link-card" href="${escaparTexto(url)}" target="_blank" rel="noopener noreferrer">
          <span class="muro-link-icon">
            <i class="material-symbols-rounded" style="font-size:1.15rem;">link</i>
          </span>
          <span>
            <strong class="d-block">Abrir recurso compartido</strong>
            <small>${escaparTexto(dominioUrl(url))}</small>
          </span>
        </a>
      `).join('');
    }

    function renderComentarios(comentarios){
      if(!comentarios || comentarios.length === 0){
        return '<div class="text-muted text-sm">Sin comentarios todavía.</div>';
      }

      return comentarios.map(comentario => `
        <div class="muro-comment mb-2">
          <div class="d-flex justify-content-between gap-2 flex-wrap mb-1">
            <div>
              <strong class="text-sm">${escaparTexto(comentario.autor_nombre)}</strong>
              <small class="text-muted ms-2">${fechaMuro(comentario.fecha)}</small>
            </div>
            ${
              Number(comentario.puede_eliminar) === 1
                ? `<button
                    class="muro-delete-comment"
                    type="button"
                    title="Eliminar comentario"
                    aria-label="Eliminar comentario"
                    onclick="eliminarComentario(${Number(comentario.id)})">
                    <i class="material-symbols-rounded" style="font-size:1.05rem;">delete</i>
                  </button>`
                : ''
            }
          </div>
          <div class="text-sm text-dark muro-contenido">${renderTextoConEnlaces(comentario.contenido)}</div>
          ${renderLinkCards(comentario.contenido)}
        </div>
      `).join('');
    }

    function renderPublicacion(publicacion){
      return `
        <article class="muro-post p-4">
          <div class="d-flex align-items-start gap-3">
            <div class="muro-avatar">${inicialesAutor(publicacion.autor_nombre)}</div>
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between gap-2 flex-wrap mb-2">
                <div>
                  <h5 class="mb-0">${escaparTexto(publicacion.autor_nombre)}</h5>
                  <small class="text-muted">${fechaMuro(publicacion.fecha)}</small>
                </div>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                  <span class="muro-chip">${publicacion.fijado == 1 ? 'Fijado · ' : ''}${escaparTexto(publicacion.tipo)}</span>
                  ${
                    Number(publicacion.puede_editar) === 1
                      ? `<button
                          class="muro-delete-comment"
                          type="button"
                          title="Editar publicación"
                          aria-label="Editar publicación"
                          onclick="editarPublicacion()">
                          <i class="material-symbols-rounded" style="font-size:1.05rem;">edit</i>
                        </button>`
                      : ''
                  }
                  ${
                    Number(publicacion.puede_eliminar) === 1
                      ? `<button
                          class="muro-delete-comment"
                          type="button"
                          title="Eliminar publicación"
                          aria-label="Eliminar publicación"
                          onclick="eliminarPublicacion()">
                          <i class="material-symbols-rounded" style="font-size:1.05rem;">delete</i>
                        </button>`
                      : ''
                  }
                </div>
              </div>

              ${publicacion.titulo ? `<h4 class="mb-3">${escaparTexto(publicacion.titulo)}</h4>` : ''}
              <p class="text-sm text-dark mb-2 muro-contenido">${renderTextoConEnlaces(publicacion.contenido)}</p>
              ${renderLinkCards(publicacion.contenido)}

              <hr>

              <h6 class="mb-3">Comentarios</h6>
              <div id="muroListaComentarios">
                ${renderComentarios(publicacion.comentarios)}
              </div>

              <div class="mt-3">
                <textarea class="form-control muro-field" id="muroRespuesta" maxlength="800" rows="3" placeholder="Responder esta conversación..."></textarea>
                <div class="d-flex justify-content-end mt-2">
                  <button class="btn muro-submit mb-0" type="button" onclick="publicarRespuesta()">
                    Responder
                  </button>
                </div>
                <div id="muroDetalleMensaje" class="mt-3"></div>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    async function editarPublicacion(){
      if(!publicacionActual){
        return;
      }

      document.getElementById('detalleEditarTitulo').value =
        publicacionActual.titulo || '';

      document.getElementById('detalleEditarContenido').value =
        publicacionActual.contenido || '';

      document.getElementById('detalleEditarMensaje').innerHTML =
        '';

      bootstrap
        .Modal
        .getOrCreateInstance(
          document.getElementById('modalEditarPublicacionDetalle')
        )
        .show();
    }

    async function guardarEdicionPublicacion(){

      const titulo =
        document.getElementById('detalleEditarTitulo').value.trim();

      const contenido =
        document.getElementById('detalleEditarContenido').value.trim();

      const mensaje = document.getElementById('muroDetalleMensaje');
      const modalMensaje = document.getElementById('detalleEditarMensaje');

      if(!contenido){
        modalMensaje.innerHTML = '<div class="alert alert-warning py-2 mb-0">Escribe contenido para la publicación.</div>';
        return;
      }

      try{
        const response = await fetch('../php/muro_publicaciones.php', {
          method:'PATCH',
          cache:'no-store',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            accion:'editar_publicacion',
            id_publicacion:idPublicacionActual,
            titulo,
            contenido
          })
        });

        const data = await response.json();

        if(!data.ok){
          throw new Error(data.mensaje || 'No se pudo editar la publicación.');
        }

        bootstrap
          .Modal
          .getOrCreateInstance(
            document.getElementById('modalEditarPublicacionDetalle')
          )
          .hide();

        await cargarPublicacion();
      }
      catch(error){
        console.error(error);
        if(modalMensaje){
          modalMensaje.innerHTML = `<div class="alert alert-danger py-2 mb-0">${escaparTexto(error.message)}</div>`;
        }
        else if(mensaje){
          mensaje.innerHTML = `<div class="alert alert-danger py-2 mb-0">${escaparTexto(error.message)}</div>`;
        }
      }
    }

    async function eliminarPublicacion(){
      if(!confirm('¿Eliminar esta publicación y sus comentarios?')){
        return;
      }

      try{
        const response = await fetch('../php/muro_publicaciones.php', {
          method:'DELETE',
          cache:'no-store',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            id_publicacion:idPublicacionActual
          })
        });

        const data = await response.json();

        if(!data.ok){
          throw new Error(data.mensaje || 'No se pudo eliminar la publicación.');
        }

        window.location.href = '../pages/index.html';
      }
      catch(error){
        console.error(error);
        const mensaje = document.getElementById('muroDetalleMensaje');
        if(mensaje){
          mensaje.innerHTML = `<div class="alert alert-danger py-2 mb-0">${escaparTexto(error.message)}</div>`;
        }
      }
    }

    async function eliminarComentario(idComentario){
      if(!confirm('¿Eliminar este comentario?')){
        return;
      }

      try{
        const response = await fetch('../php/muro_publicaciones.php', {
          method:'DELETE',
          cache:'no-store',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            id_comentario:idComentario
          })
        });

        const data = await response.json();

        if(!data.ok){
          throw new Error(data.mensaje || 'No se pudo eliminar el comentario.');
        }

        await cargarPublicacion();
      }
      catch(error){
        console.error(error);
        const mensaje = document.getElementById('muroDetalleMensaje');
        if(mensaje){
          mensaje.innerHTML = `<div class="alert alert-danger py-2 mb-0">${escaparTexto(error.message)}</div>`;
        }
      }
    }

    async function marcarLeida(){
      if(!idPublicacionActual){
        return;
      }

      await fetch('../php/notificaciones.php', {
        method:'PATCH',
        cache:'no-store',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          accion:'leer_publicacion',
          id_publicacion:idPublicacionActual
        })
      });
    }

    async function cargarPublicacion(){
      const contenedor = document.getElementById('muroDetalleContenido');

      if(!idPublicacionActual){
        contenedor.innerHTML = '<div class="alert alert-danger">Publicación inválida.</div>';
        return;
      }

      try{
        const response = await fetch(`../php/muro_publicaciones.php?id=${idPublicacionActual}`, {
          cache:'no-store'
        });

        const data = await response.json();

        if(!data.ok || !data.publicaciones || data.publicaciones.length === 0){
          throw new Error('No se encontró la publicación.');
        }

        publicacionActual = data.publicaciones[0];
        contenedor.innerHTML = renderPublicacion(publicacionActual);
        await marcarLeida();

        if(window.cargarNotificacionesImssight){
          window.cargarNotificacionesImssight();
        }
      }
      catch(error){
        console.error(error);
        contenedor.innerHTML = `<div class="alert alert-danger">${escaparTexto(error.message)}</div>`;
      }
    }

    async function publicarRespuesta(){
      const input = document.getElementById('muroRespuesta');
      const mensaje = document.getElementById('muroDetalleMensaje');
      const contenido = input.value.trim();

      if(!contenido){
        mensaje.innerHTML = '<div class="alert alert-warning py-2 mb-0">Escribe una respuesta.</div>';
        return;
      }

      try{
        const response = await fetch('../php/muro_publicaciones.php', {
          method:'POST',
          cache:'no-store',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            accion:'comentar',
            id_publicacion:idPublicacionActual,
            contenido
          })
        });

        const data = await response.json();

        if(!data.ok){
          throw new Error(data.mensaje || 'No se pudo responder.');
        }

        input.value = '';
        await cargarPublicacion();
      }
      catch(error){
        console.error(error);
        mensaje.innerHTML = `<div class="alert alert-danger py-2 mb-0">${escaparTexto(error.message)}</div>`;
      }
    }

    async function verificarSesion(){
      const response = await fetch('../php/auth.php');
      const data = await response.json();

      if(!data.auth){
        window.location.href = '../pages/sign-in.html';
        return;
      }

      cargarPublicacion();

      // MOSTRAR NOMBRE

      document.getElementById(
          'bienvenida'
      ).innerHTML =

          `Bienvenido ${data.usuario.nombre}`;
    }

    verificarSesion();
  </script>
