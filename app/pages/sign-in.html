  <script>

const loginForm = document.getElementById('loginForm');
const matriculaInput = document.getElementById('matricula');
const passwordInput = document.getElementById('password');
const authFeedback = document.getElementById('authFeedback');
const loginButton = document.getElementById('loginButton');
const securityAttemptImage = document.getElementById('securityAttemptImage');
const suspiciousSqlPatterns = [
    /(?:'|"|`)\s*(?:or|and)\s*(?:'|"|`)?[a-z0-9_]+(?:'|"|`)?\s*=\s*(?:'|"|`)?[a-z0-9_]+/i,
    /\b(?:or|and)\b\s+\d+\s*=\s*\d+/i,
    /\b(?:or|and)\b\s+(?:true|false|null)\b/i,
    /(?:'|"|`)\s*=\s*(?:'|"|`)/,
    /\bunion\b\s+(?:all\s+)?\bselect\b/i,
    /;\s*(?:select|insert|update|delete|drop|alter|create|truncate)\b/i,
    /(?:--|#|\/\*)/,
    /\b(?:sleep|benchmark|load_file|information_schema)\b/i
];

function setAuthState(state, message = ''){
    loginForm.classList.remove('auth-neutral', 'auth-error', 'auth-success');

    if(state){
        loginForm.classList.add(`auth-${state}`);
    }

    authFeedback.textContent = message;
    authFeedback.classList.toggle('is-empty', !message);
}

function containsSuspiciousSql(value){
    return suspiciousSqlPatterns.some((pattern) => pattern.test(value));
}

function showSecurityAttempt(){
    setAuthState('error', 'Buen intento jajajajajaa... no nací ayer.');

    securityAttemptImage.classList.add('is-visible');
    securityAttemptImage.setAttribute('aria-hidden', 'false');
}

function hideSecurityAttempt(){
    securityAttemptImage.classList.remove('is-visible');
    securityAttemptImage.setAttribute('aria-hidden', 'true');
}

[matriculaInput, passwordInput].forEach((input) => {
    input.addEventListener('click', () => {
        if(!loginForm.classList.contains('auth-error') && !loginForm.classList.contains('auth-success')){
            setAuthState('neutral', 'Ingresa tus credenciales.');
        }
    });

    input.addEventListener('input', () => {
        hideSecurityAttempt();
        setAuthState('neutral', 'Ingresa tus credenciales.');
    });

    input.addEventListener('focus', () => {
        if(!loginForm.classList.contains('auth-error') && !loginForm.classList.contains('auth-success')){
            setAuthState('neutral', 'Ingresa tus credenciales.');
        }
    });
});

securityAttemptImage.addEventListener('click', hideSecurityAttempt);

document.addEventListener('keydown', (event) => {
    if(event.key === 'Escape'){
        hideSecurityAttempt();
    }
});

loginForm.addEventListener('focusin', (event) => {
    if(
        (event.target === matriculaInput || event.target === passwordInput) &&
        !loginForm.classList.contains('auth-error') &&
        !loginForm.classList.contains('auth-success')
    ){
        setAuthState('neutral', 'Ingresa tus credenciales.');
    }
});

loginForm.addEventListener('submit', login);

async function login(event){

    event.preventDefault();

    setAuthState('neutral', 'Validando credenciales...');
    loginButton.disabled = true;

    const data = {

        matricula: matriculaInput.value,

        password: passwordInput.value

    };

    if(
        containsSuspiciousSql(data.matricula) ||
        containsSuspiciousSql(data.password)
    ){
        showSecurityAttempt();
        loginButton.disabled = false;
        return;
    }

    try {

        const response = await fetch(

            '../php/login.php',

            {

                method:'POST',

                headers:{

                    'Content-Type':'application/json'

                },

                body:JSON.stringify(data)

            }

        );

        const resultado =

            await response.json();

        if(resultado.success){

            setAuthState('success', 'Credenciales correctas. Redirigiendo...');

            setTimeout(() => {

                window.location.href =

                    '../pages/index.html';

            }, 700);

            return;

        }

        if(resultado.security_alert){
            showSecurityAttempt();
            return;
        }

        setAuthState(

            'error',

            'Credenciales incorrectas!'

        );

    } catch (error) {

        setAuthState('error', 'Credenciales incorrectas!');

    } finally {

        if(!loginForm.classList.contains('auth-success')){

            loginButton.disabled = false;

        }

    }

}

</script>
