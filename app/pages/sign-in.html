  <script>

async function login(){

    const data = {

        matricula:

            document.getElementById(

                'matricula'

            ).value,

        password:

            document.getElementById(

                'password'

            ).value

    };

    const response = await fetch(

        '../php/login.php',

        {

            method:'POST',

            headers:{

                'Content-Type':'application/json'

            },

            body:JSON.stringify(data)

        }

    );

    const resultado =

        await response.json();

    if(resultado.success){

        window.location.href =

            '../pages/index.html';

    } else {

        alert(

            resultado.message

        );

    }

}

</script>
