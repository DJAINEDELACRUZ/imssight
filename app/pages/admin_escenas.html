<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Administrador IMSSight</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.card-admin{

    border:none;

    border-radius:20px;

    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

textarea{

    width:100%;

    min-height:350px;

    background:#1e1e1e;

    color:#00ff90;

    border:none;

    border-radius:15px;

    padding:20px;

    font-family:monospace;
}

.preview{

    background:white;

    min-height:300px;

    border-radius:15px;

    padding:20px;

    border:2px dashed #ccc;

    overflow:auto;
}

.lista-escenas{

    max-height:600px;

    overflow:auto;
}

.item-escena{

    cursor:pointer;

    transition:.2s;
}

.item-escena:hover{

    transform:scale(1.02);
}

</style>

</head>

<body>

<div class="container py-5">

    <div class="card card-admin">

        <div class="card-body p-4">

            <h1 class="mb-4">
                Administrador IMSSight 😄
            </h1>

            <div class="row mb-4">

                <div class="col-md-4">

                    <label>
                        Especialidad
                    </label>

                    <select
                        id="especialidad"
                        class="form-select"
                        onchange="cargarTemas()">

                    </select>

                </div>

                <div class="col-md-4">

                    <label>
                        Tema
                    </label>

                    <select
                        id="tema"
                        class="form-select"
                        onchange="cargarCasos()">

                    </select>

                </div>

                <div class="col-md-4">

                    <label>
                        Caso clínico
                    </label>

                    <select
                        id="caso"
                        class="form-select"
                        onchange="cargarEscenas()">

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col-md-4">

                    <h4 class="mb-3">
                        Escenas
                    </h4>

                    <div
                        id="listaEscenas"
                        class="lista-escenas">

                    </div>

                    <div class="text-center mt-3">

                        <button
                            class="btn btn-success rounded-circle"
                            style="width:60px;height:60px;font-size:30px;"
                            onclick="nuevaEscena()">

                            +

                        </button>

                    </div>

                </div>

                <div class="col-md-8">

                    <div class="mb-3">

                        <label>
                            ID Escena
                        </label>

                        <input
                            type="text"
                            id="idEscena"
                            class="form-control"
                            readonly>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>
                                Orden
                            </label>

                            <input
                                type="number"
                                id="orden"
                                class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>
                                Tipo
                            </label>

                            <input
                                type="text"
                                id="tipo"
                                class="form-control">

                        </div>

                    </div>

                    <div class="mb-3">

                        <label>
                            Título
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>
                            Multimedia
                        </label>

                        <input
                            type="text"
                            id="multimedia"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>
                            Contenido HTML
                        </label>

                        <textarea id="contenido"></textarea>

                    </div>

                    <div class="d-flex gap-2 mb-3">

                        <button
                            class="btn btn-primary"
                            onclick="previsualizar()">

                            Vista previa

                        </button>

                        <button
                            class="btn btn-success"
                            onclick="guardarCambios()">

                            Guardar cambios

                        </button>

                    </div>

                    <div
                        id="preview"
                        class="preview">

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

let escenas = [];

async function cargarEspecialidades(){

    try{

        const response = await fetch(
            '/php/get_especialidades.php'
        );

        const data = await response.json();

        const combo =
            document.getElementById('especialidad');

        combo.innerHTML = '';

        data.forEach(item => {

            combo.innerHTML += `

                <option value="${item.id}">

                    ${item.nombre}

                </option>

            `;

        });

        await cargarTemas();

    } catch(error){

        console.error(
            'Error cargarEspecialidades:',
            error
        );

    }

}

async function cargarTemas(){

    try{

        const id =
            document.getElementById('especialidad').value;

        const response = await fetch(
            `/php/get_temas.php?id=${id}`
        );

        const data = await response.json();

        const combo =
            document.getElementById('tema');

        combo.innerHTML = '';

        data.forEach(item => {

            combo.innerHTML += `

                <option value="${item.id}">

                    ${item.titulo}

                </option>

            `;

        });

        await cargarCasos();

    } catch(error){

        console.error(
            'Error cargarTemas:',
            error
        );

    }

}

async function cargarCasos(){

    try{

        const idTema =
            document.getElementById('tema').value;

        const response = await fetch(
            `/php/get_casos.php?id=${idTema}`
        );

        const data = await response.json();

        const combo =
            document.getElementById('caso');

        combo.innerHTML = '';

        data.forEach(item => {

            combo.innerHTML += `

                <option value="${item.id}">

                    ${item.titulo}

                </option>

            `;

        });

        // Esperar a que el DOM actualice el select
        setTimeout(async () => {

            await cargarEscenas();

        }, 50);

    } catch(error){

        console.error(
            'Error cargarCasos:',
            error
        );

    }

}

async function cargarEscenas(){

    const comboCaso =
        document.getElementById('caso');

    const idCaso =
        comboCaso.options[
            comboCaso.selectedIndex
        ]?.value;

    console.log('ID CASO:', idCaso);

    if(!idCaso){

        document.getElementById(
            'listaEscenas'
        ).innerHTML = `

            <div class="alert alert-warning">

                No hay caso seleccionado.

            </div>

        `;

        return;
    }

    const response = await fetch(
        `/php/get_escenas.php?id=${idCaso}`
    );

    escenas = await response.json();

    console.log('ESCENAS:', escenas);

    const lista =
        document.getElementById('listaEscenas');

    lista.innerHTML = '';

    if(escenas.length === 0){

        lista.innerHTML = `

            <div class="alert alert-warning">

                No hay escenas registradas para este caso clínico.

            </div>

        `;

        return;
    }

    escenas.forEach(escena => {

        lista.innerHTML += `

            <div
                class="card mb-2 item-escena"
                onclick="abrirEscena(${escena.id})">

                <div class="card-body">

                    <strong>

                        ${escena.orden}

                    </strong>

                    -

                    ${escena.titulo}

                </div>

            </div>

        `;

    });

    abrirEscena(escenas[0].id);

}

function abrirEscena(id){

    const escena =
        escenas.find(e => e.id == id);

    if(!escena){

        console.error(
            'Escena no encontrada:',
            id
        );

        return;

    }

    document.getElementById('idEscena')
        .value = escena.id;

    document.getElementById('orden')
        .value = escena.orden;

    document.getElementById('tipo')
        .value = escena.tipo;

    document.getElementById('titulo')
        .value = escena.titulo;

    document.getElementById('multimedia')
        .value = escena.multimedia ?? '';

    document.getElementById('contenido')
        .value = escena.contenido ?? '';

    previsualizar();

}

function previsualizar(){

    document.getElementById('preview')
        .innerHTML =
        document.getElementById('contenido').value;

}

async function guardarCambios(){

    try{

        const data = {

            id:
                document.getElementById('idEscena').value,

            orden:
                document.getElementById('orden').value,

            tipo:
                document.getElementById('tipo').value,

            titulo:
                document.getElementById('titulo').value,

            multimedia:
                document.getElementById('multimedia').value,

            contenido:
                document.getElementById('contenido').value

        };

        const response = await fetch(

            '/php/update_escena.php',

            {

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify(data)

            }

        );

        const resultado =
            await response.json();

        alert(resultado.mensaje);

        await cargarEscenas();

    } catch(error){

        console.error(
            'Error guardarCambios:',
            error
        );

    }

}

function nuevaEscena(){

    const idCaso =
        document.getElementById('caso').value;

    const siguienteOrden =
        escenas.length + 1;

    window.location.href =

        `editorEscenas.html?idCaso=${idCaso}&orden=${siguienteOrden}`;

}

cargarEspecialidades();

</script>

</body>
</html>
