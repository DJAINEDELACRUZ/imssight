<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Admin Casos Clínicos
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>
                Casos clínicos
            </h1>

            <p class="text-muted">
                Administración IMSSight
            </p>

        </div>

        <a
            href="profile.html"
            class="btn btn-dark">

            Volver

        </a>

    </div>

    <!-- SELECT ESPECIALIDAD -->

    <div class="card shadow border-0 mb-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-6">

                    <label>
                        Especialidad
                    </label>

                    <select
                        id="selectEspecialidad"
                        class="form-select"
                        onchange="cargarTemas()">

                    </select>

                </div>

                <div class="col-md-6">

                    <label>
                        Tema
                    </label>

                    <select
                        id="selectTema"
                        class="form-select"
                        onchange="cargarCasos()">

                    </select>

                </div>

            </div>

        </div>

    </div>

    <!-- NUEVO CASO -->

    <div class="card shadow border-0 mb-5">

        <div class="card-body">

            <h4 class="mb-4">
                Nuevo caso clínico
            </h4>

            <div class="row">

                <div class="col-md-4">

                    <label>
                        Título
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        class="form-control">

                </div>

                <div class="col-md-4">

                    <label>
                        Descripción
                    </label>

                    <input
                        type="text"
                        id="descripcion"
                        class="form-control">

                </div>

                <div class="col-md-2">

                    <label>
                        Portada
                    </label>

                    <input
                        type="text"
                        id="portada"
                        class="form-control"
                        placeholder="../img/caso.png">
                </div>

                <div class="col-md-2">

                    <label>
                        Dificultad
                    </label>

                    <select
                        id="dificultad"
                        class="form-select">

                        <option>Básico</option>
                        <option>Intermedio</option>
                        <option>Avanzado</option>

                    </select>

                </div>

                <div class="col-md-2 d-grid">

                    <label style="opacity:0;">
                        guardar
                    </label>

                    <button
                        class="btn btn-success"
                        onclick="guardarCaso()">

                        Guardar

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- TABLA -->

    <div class="card shadow border-0">

        <div class="card-body">

            <h4 class="mb-4">
                Casos clínicos registrados
            </h4>

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Título</th>
                            <th>Descripción</th>
                            <th>Portada</th>
                            <th>Dificultad</th>
                            <th>Escenas</th>
                            <th>Guardar</th>

                        </tr>

                    </thead>

                    <tbody id="tablaCasos">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

async function cargarEspecialidades() {

    const response =
        await fetch('../php/get_especialidades.php');

    const especialidades =
        await response.json();

    const select =
        document.getElementById(
            'selectEspecialidad'
        );

    select.innerHTML = '';

    especialidades.forEach(e => {

        select.innerHTML += `

            <option value="${e.id}">

                ${e.nombre}

            </option>

        `;

    });

    cargarTemas();

}

async function cargarTemas() {

    const idEspecialidad =
        document.getElementById(
            'selectEspecialidad'
        ).value;

    const response =
        await fetch(
            `../php/get_temas_admin.php?id=${idEspecialidad}`
        );

    const temas =
        await response.json();

    const selectTema =
        document.getElementById(
            'selectTema'
        );

    selectTema.innerHTML = '';

    temas.forEach(t => {

        selectTema.innerHTML += `

            <option value="${t.id}">

                ${t.titulo}

            </option>

        `;

    });

    cargarCasos();

}

async function cargarCasos() {

    const idTema =
        document.getElementById(
            'selectTema'
        ).value;

    const response =
        await fetch(
            `../php/casos.php?id=${idTema}`
        );

    const casos =
        await response.json();

    const tabla =
        document.getElementById(
            'tablaCasos'
        );

    tabla.innerHTML = '';

    casos.forEach(c => {

        tabla.innerHTML += `

            <tr>

                <td>

                    ${c.id}

                </td>

                <td>

                    <input
                        type="text"
                        id="titulo_${c.id}"
                        class="form-control"
                        value="${c.titulo}">

                </td>

                <td>

                    <input
                        type="text"
                        id="descripcion_${c.id}"
                        class="form-control"
                        value="${c.descripcion}">

                </td>

                <td>

                    <input
                        type="text"
                        id="portada_${c.id}"
                        class="form-control"
                        value="${c.portada ?? ''}">

                </td>

               <td>

                    <select
                        id="dificultad_${c.id}"
                        class="form-select">

                        <option
                            ${c.dificultad == 'Básico' ? 'selected' : ''}>

                            Básico

                        </option>

                        <option
                            ${c.dificultad == 'Intermedio' ? 'selected' : ''}>

                            Intermedio

                        </option>

                        <option
                            ${c.dificultad == 'Avanzado' ? 'selected' : ''}>

                            Avanzado

                        </option>

                    </select>

                </td>

                <td>

                    <a
                        href="admin_escenas.html?id=${c.id}"
                        class="btn btn-info btn-sm">

                        Escenas

                    </a>

                </td>

                <td>

                    <button
                        class="btn btn-primary btn-sm"
                        onclick="actualizarCaso(${c.id})">

                        Guardar

                    </button>

                </td>

            </tr>

        `;

    });

}

async function guardarCaso() {

    const id_tema =
        document.getElementById(
            'selectTema'
        ).value;

    const titulo =
        document.getElementById(
            'titulo'
        ).value;

    const descripcion =
        document.getElementById(
            'descripcion'
        ).value;

    const portada =
        document.getElementById(
            'portada'
        ).value;

    const dificultad =
        document.getElementById(
            'dificultad'
        ).value;

    const response = await fetch(

        '../php/casos.php',

        {

            method: 'POST',

            headers: {
                'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

                id_tema,
                titulo,
                descripcion,
                portada,
                dificultad

            })

        }

    );

    const resultado =
        await response.json();

    alert(resultado.mensaje);

    cargarCasos();

}

async function actualizarCaso(id) {

    const titulo =
        document.getElementById(
            `titulo_${id}`
        ).value;

    const descripcion =
        document.getElementById(
            `descripcion_${id}`
        ).value;

    const portada =
        document.getElementById(
            `portada_${id}`
        ).value;

    const dificultad =
        document.getElementById(
            `dificultad_${id}`
        ).value;

    const response = await fetch(

        '../php/casos.php',

        {

            method: 'POST',

            headers: {
                'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

                id,
                titulo,
                descripcion,
                portada,
                dificultad,
                activo: 1

            })

        }

    );

    const resultado =
        await response.json();

    alert(resultado.mensaje);

    cargarCasos();

}


cargarEspecialidades();

</script>

</body>
</html>
