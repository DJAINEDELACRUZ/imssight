<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Admin Temas
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>
                Temas
            </h1>

            <p class="text-muted">
                Administración IMSSight
            </p>

        </div>

        <a
            href="profile.html"
            class="btn btn-dark">

            Volver

        </a>

    </div>

    <!-- SELECT ESPECIALIDAD -->

    <div class="card shadow border-0 mb-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-6">

                    <label>
                        Especialidad
                    </label>

                    <select
                        id="selectEspecialidad"
                        class="form-select"
                        onchange="cargarTemas()">

                    </select>

                </div>

            </div>

        </div>

    </div>

    <!-- NUEVO TEMA -->

    <div class="card shadow border-0 mb-5">

        <div class="card-body">

            <h4 class="mb-4">
                Nuevo tema
            </h4>

            <div class="row">

                <div class="col-md-4">

                    <label>
                        Título
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        class="form-control">

                </div>

                <div class="col-md-4">

                    <label>
                        Descripción
                    </label>

                    <input
                        type="text"
                        id="descripcion"
                        class="form-control">

                </div>

                <div class="col-md-2">

                    <label>
                        Imagen
                    </label>

                    <input
                        type="text"
                        id="imagen"
                        class="form-control"
                        placeholder="../img/tema.png">

                </div>

                <div class="col-md-2 d-grid">

                    <label style="opacity:0;">
                        guardar
                    </label>

                    <button
                        class="btn btn-success"
                        onclick="guardarTema()">

                        Guardar

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- TABLA -->

    <div class="card shadow border-0">

        <div class="card-body">

            <h4 class="mb-4">
                Temas registrados
            </h4>

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Título</th>
                            <th>Descripción</th>
                            <th>Imagen</th>
                            <th>Guardar</th>

                        </tr>

                    </thead>

                    <tbody id="tablaTemas">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

async function cargarEspecialidades() {

    const response =
        await fetch('../php/get_especialidades.php');

    const especialidades =
        await response.json();

    const select =
        document.getElementById('selectEspecialidad');

    select.innerHTML = '';

    especialidades.forEach(e => {

        select.innerHTML += `

            <option value="${e.id}">

                ${e.nombre}

            </option>

        `;

    });

    cargarTemas();

}

async function cargarTemas() {

    const idEspecialidad =
        document.getElementById(
            'selectEspecialidad'
        ).value;

    const response =
        await fetch(
            `../php/get_temas_admin.php?id=${idEspecialidad}`
        );

    const temas =
        await response.json();

    const tabla =
        document.getElementById('tablaTemas');

    tabla.innerHTML = '';

    temas.forEach(t => {

        tabla.innerHTML += `

            <tr>

                <td>
                    ${t.id}
                </td>

                <td>

                    <input
                        type="text"
                        id="titulo_${t.id}"
                        class="form-control"
                        value="${t.titulo}">

                </td>

                <td>

                    <input
                        type="text"
                        id="descripcion_${t.id}"
                        class="form-control"
                        value="${t.descripcion}">

                </td>

                <td>

                    <input
                        type="text"
                        id="imagen_${t.id}"
                        class="form-control"
                        value="${t.imagen ?? ''}">

                </td>

                <td>

                    <button
                        class="btn btn-primary btn-sm"
                        onclick="actualizarTema(${t.id})">

                        Guardar

                    </button>

                </td>

            </tr>

        `;

    });

}

async function guardarTema() {

    const id_especialidad =
        document.getElementById(
            'selectEspecialidad'
        ).value;

    const titulo =
        document.getElementById(
            'titulo'
        ).value;

    const descripcion =
        document.getElementById(
            'descripcion'
        ).value;

    const imagen =
        document.getElementById(
            'imagen'
        ).value;

    const response = await fetch(

        '../php/guardar_tema.php',

        {

            method: 'POST',

            headers: {
                'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

                id_especialidad,
                titulo,
                descripcion,
                imagen

            })

        }

    );

    const resultado =
        await response.json();

    alert(resultado.mensaje);

    cargarTemas();

}

async function actualizarTema(id) {

    const titulo =
        document.getElementById(
            `titulo_${id}`
        ).value;

    const descripcion =
        document.getElementById(
            `descripcion_${id}`
        ).value;

    const imagen =
        document.getElementById(
            `imagen_${id}`
        ).value;

    const response = await fetch(

        '../php/update_tema.php',

        {

            method: 'POST',

            headers: {
                'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

                id,
                titulo,
                descripcion,
                imagen

            })

        }

    );

    const resultado =
        await response.json();

    alert(resultado.mensaje);

    cargarTemas();

}

cargarEspecialidades();

</script>

</body>
</html>
